name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem would this feature solve? What's the use case?
      placeholder: |
        As a [researcher/lab manager/admin], I need to [do something] because [reason].
        Currently, I have to [workaround], which is problematic because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        I'd like to be able to...
        The command/interface would look like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: |
        I considered [alternative 1], but...
        Another approach might be...

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area would this feature affect?
      options:
        - Multiregion coordination
        - Staging optimization
        - Budget tracking
        - CLI interface
        - S3 upload
        - Compression
        - Configuration
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: User Persona
      description: Which user type would most benefit from this?
      options:
        - Academic Researcher
        - Lab Manager
        - Graduate Student
        - Principal Investigator (PI)
        - Research Computing Administrator
        - General User
        - All Users
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: Show how you would use this feature (commands, API calls, configuration, etc.)
      render: shell
      placeholder: |
        $ cargoship [new-command] --option value
        # Output:
        # ...

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: What are the benefits of implementing this feature?
      placeholder: |
        - Reduces upload time by...
        - Simplifies workflow for...
        - Enables use case of...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical - Blocking my work
        - High - Would significantly improve my workflow
        - Medium - Would be nice to have
        - Low - Minor improvement
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, references, or examples
      placeholder: |
        Similar features in other tools:
        - Tool X does [this]...

        References:
        - Research paper: [link]
        - Documentation: [link]

  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: Would you be willing to help implement this feature?
      options:
        - label: I'm willing to submit a pull request for this feature
        - label: I'm willing to test this feature once implemented
        - label: I can provide more detailed requirements if needed

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have provided sufficient detail above
          required: true
