name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: "When I run 'cargoship upload ...', the command fails with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command '...'
        2. With these settings '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: "The upload should complete successfully..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: "Instead, I get this error..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Please paste relevant log output here. Use --verbose flag for detailed logs.
        This will be automatically formatted as code.
      render: shell
      placeholder: |
        $ cargoship upload --verbose ...
        [Paste output here]

  - type: input
    id: version
    attributes:
      label: CargoShip Version
      description: "Output of: cargoship --version"
      placeholder: "v0.4.6"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "e.g., Ubuntu 22.04, macOS 14.0, Windows 11"
      placeholder: "Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: "Output of: go version (if building from source)"
      placeholder: "go version go1.21.0 linux/amd64"

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        Your ~/.cargoship.yaml configuration (please redact sensitive information like AWS credentials)
      render: yaml
      placeholder: |
        aws:
          region: us-east-1
          profile: default
        # ...

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area does this bug affect?
      options:
        - Multiregion coordination
        - Staging optimization
        - Budget tracking
        - CLI interface
        - S3 upload
        - Compression
        - Configuration
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)
      placeholder: "This started happening after..."

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      description: Please verify you've done the following
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have included all relevant information above
          required: true
        - label: I have redacted any sensitive information from logs and configuration
          required: true
