version: 2
updates:
  # Go modules dependency updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    # Wait before opening PRs for freshly-published versions, so a
    # just-released malicious version isn't picked up immediately.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore patch updates for stable dependencies
      - dependency-name: "github.com/aws/aws-sdk-go-v2*"
        update-types: ["version-update:semver-patch"]
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/golang/mock"
        update-types:
          - "minor"
          - "patch"
      security:
        patterns:
          - "*"
        dependency-type: "all"
        update-types:
          - "security"

  # GitHub Actions workflow dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    allow:
      - dependency-type: "direct"

  # Docker dependency updates (if any Dockerfiles exist)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"