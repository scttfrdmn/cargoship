version: 2
updates:
  # Go modules dependency updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    # Wait before opening PRs for freshly-published versions, so a
    # just-released malicious version isn't picked up immediately.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore patch updates for stable dependencies
      - dependency-name: "github.com/aws/aws-sdk-go-v2*"
        update-types: ["version-update:semver-patch"]
    groups:
      aws-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "github.com/stretchr/testify"
          - "github.com/golang/mock"
        update-types:
          - "minor"
          - "patch"
      # There was a third group here, `security:`, with `dependency-type: "all"`
      # and `update-types: ["security"]`. Both values are invalid for a group —
      # `dependency-type` accepts only production/development, and `update-types`
      # only major/minor/patch — and **Dependabot rejects the entire file on a
      # parse error**, so no configured update in any ecosystem here had ever run
      # (#366). It was introduced with the file in July 2025 and stayed invisible
      # because Dependabot only re-validates when the file changes; the docker
      # `directory:` edit in #358 is what finally triggered a re-parse.
      #
      # It is not fixable, only removable: `security` is not an update-type.
      # Security updates are a separate Dependabot mechanism that ignores
      # `groups:` entirely and always groups per advisory — which is why security
      # PRs kept arriving from this repo while version updates never did, and why
      # the group was a no-op in intent as well as in syntax.

  # GitHub Actions workflow dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    allow:
      - dependency-type: "direct"

  # Docker base-image updates. Scoped to /docker, where the Dockerfiles actually
  # live: this was "/" and therefore watched nothing, which is part of why an
  # end-of-support Alpine 3.18 base survived in three images (#358). Bases are now
  # digest-pinned, so this is the mechanism that proposes moving those pins —
  # without it, pinning would mean freezing.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "scttfrdmn"
    assignees:
      - "scttfrdmn"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"