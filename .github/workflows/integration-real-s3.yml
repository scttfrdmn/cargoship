name: Integration Tests (Real S3)

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter pattern (optional, e.g., TestS3Upload)'
        required: false
        type: string
      aws_region:
        description: 'AWS region for testing'
        required: false
        type: choice
        options:
          - us-west-2
          - us-east-1
          - eu-west-1
        default: 'us-west-2'

env:
  GO_VERSION: '1.26'

jobs:
  real-s3-integration:
    name: Integration Tests with Real AWS S3
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Only run if AWS_ROLE_ARN secret is configured
    if: vars.AWS_ROLE_ARN != '' || secrets.AWS_ACCESS_KEY_ID != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Configure AWS Credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'us-west-2' }}

      - name: Configure AWS Credentials (Access Keys)
        if: vars.AWS_ROLE_ARN == '' && secrets.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region || 'us-west-2' }}

      - name: Create Test Bucket
        id: bucket
        run: |
          TIMESTAMP=$(date +%s)
          REGION="${{ inputs.aws_region || 'us-west-2' }}"
          BUCKET="cargoship-ci-integration-${TIMESTAMP}"

          echo "Creating test bucket: ${BUCKET} in ${REGION}"
          aws s3 mb "s3://${BUCKET}" --region "${REGION}"

          # Tag bucket for identification and cleanup
          aws s3api put-bucket-tagging \
            --bucket "${BUCKET}" \
            --tagging "TagSet=[
              {Key=Project,Value=CargoShip},
              {Key=Environment,Value=CI},
              {Key=Purpose,Value=IntegrationTest},
              {Key=Timestamp,Value=${TIMESTAMP}},
              {Key=GitHubRun,Value=${{ github.run_id }}},
              {Key=GitHubWorkflow,Value=${{ github.workflow }}}
            ]"

          # Add lifecycle policy to auto-delete after 1 day as safety net
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "${BUCKET}" \
            --lifecycle-configuration '{
              "Rules": [{
                "Id": "AutoCleanup",
                "Status": "Enabled",
                "Expiration": {"Days": 1}
              }]
            }'

          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "region=${REGION}" >> $GITHUB_OUTPUT

      - name: Run Integration Tests
        id: run_tests
        env:
          CARGOSHIP_ENABLE_S3_INTEGRATION_TESTS: "1"
          CARGOSHIP_TEST_BUCKET: ${{ steps.bucket.outputs.bucket }}
          AWS_REGION: ${{ steps.bucket.outputs.region }}
        run: |
          TEST_FILTER="${{ inputs.test_filter }}"
          START_TIME=$(date +%s)

          echo "Running integration tests against real S3..."
          echo "Test bucket: ${CARGOSHIP_TEST_BUCKET}"
          echo "Region: ${AWS_REGION}"
          [ -n "${TEST_FILTER}" ] && echo "Filter: ${TEST_FILTER}"

          go test -tags=integration \
            -v \
            -timeout=45m \
            -json \
            ${TEST_FILTER:+-run ${TEST_FILTER}} \
            ./... \
            2>&1 | tee real-s3-test-output.json

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "Tests completed in ${DURATION} seconds"

      - name: Parse Test Results
        if: always()
        id: test_results
        run: |
          # Count test results from JSON output
          if [ -f real-s3-test-output.json ]; then
            PASSED=$(jq -r 'select(.Action=="pass" and .Test != null) | .Test' real-s3-test-output.json | sort -u | wc -l)
            FAILED=$(jq -r 'select(.Action=="fail" and .Test != null) | .Test' real-s3-test-output.json | sort -u | wc -l)
            SKIPPED=$(jq -r 'select(.Action=="skip" and .Test != null) | .Test' real-s3-test-output.json | sort -u | wc -l)

            echo "passed=${PASSED}" >> $GITHUB_OUTPUT
            echo "failed=${FAILED}" >> $GITHUB_OUTPUT
            echo "skipped=${SKIPPED}" >> $GITHUB_OUTPUT

            # Extract failed test names
            jq -r 'select(.Action=="fail" and .Test != null) | .Test' real-s3-test-output.json | sort -u > failed-tests.txt
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "skipped=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-s3-test-results
          path: |
            real-s3-test-output.json
            failed-tests.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Cleanup Test Bucket
        if: always()
        run: |
          BUCKET="${{ steps.bucket.outputs.bucket }}"

          if [ -z "${BUCKET}" ]; then
            echo "No bucket to clean up"
            exit 0
          fi

          echo "Cleaning up test bucket: ${BUCKET}"

          # Delete all objects and versions
          echo "Deleting all objects..."
          aws s3 rm "s3://${BUCKET}" --recursive || true

          # Check if versioning is enabled and delete versions if needed
          VERSIONING=$(aws s3api get-bucket-versioning --bucket "${BUCKET}" --query 'Status' --output text 2>/dev/null || echo "Disabled")
          if [ "${VERSIONING}" == "Enabled" ]; then
            echo "Deleting object versions..."
            aws s3api list-object-versions --bucket "${BUCKET}" --output json | \
              jq -r '.Versions[]? | "--key '\''\(.Key)'\'' --version-id '\''\(.VersionId)'\''"' | \
              xargs -I {} -n 4 aws s3api delete-object --bucket "${BUCKET}" {} || true
          fi

          # Delete bucket
          echo "Deleting bucket..."
          aws s3 rb "s3://${BUCKET}" --force || true

          echo "✅ Cleanup complete"

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## 🌩️ Real S3 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All integration tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some integration tests failed**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed**: ${{ steps.test_results.outputs.passed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed**: ${{ steps.test_results.outputs.failed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Skipped**: ${{ steps.test_results.outputs.skipped }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ steps.run_tests.outputs.duration || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ steps.bucket.outputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Bucket**: ${{ steps.bucket.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f failed-tests.txt ] && [ -s failed-tests.txt ]; then
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat failed-tests.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on Failure
        if: failure() && vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ vars.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Real S3 Integration Tests Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Real S3 Integration Tests Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Passed:*\n${{ steps.test_results.outputs.passed }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Failed:*\n${{ steps.test_results.outputs.failed }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
