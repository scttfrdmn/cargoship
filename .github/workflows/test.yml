name: Tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.26'

jobs:
  # The plain unit-test run lives in the Code Coverage job below, which runs the
  # identical `go test ./... -short` plus a coverage profile — a separate "Test"
  # job would be pure duplication, so it's intentionally omitted.

  build-tags:
    name: Build Tags Compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Compile-checks every custom build tag in the tree. The `performance` and
      # `benchmark` suites need real AWS to RUN, so nothing here runs them — but
      # nothing compiled them either, and both had been broken on main for an
      # unknown length of time (#329). Compiling is the part that regresses.
      - name: Check all build tags compile
        run: bash scripts/ci/check-build-tags.sh

  e2e-quickstart:
    name: Quick Start E2E (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Drives the real cargoship binary through the documented Quick Start
      # (upload → info → verify → restore) against an in-process Substrate S3
      # emulator. No AWS credentials required. Guards docs/start/quickstart.md.
      - name: Run Quick Start end-to-end
        run: go test -tags e2e ./tests/e2e/ -timeout 10m

  integration:
    name: Integration (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Runs the //go:build integration suites against the in-process Substrate
      # S3 emulator — no AWS credentials required. These exercise the seams
      # (upload → manifest → restore round-trips, DVC workflows, S3 transporter)
      # that unit tests miss. Real-AWS-only assertions self-skip without
      # CARGOSHIP_ENABLE_S3_INTEGRATION_TESTS. (#238)
      #
      # -short is deliberate: the emulator integration tests don't gate on it, so
      # they still run, while the sleep-heavy multiregion failover/perf tests
      # (~85s, pure timing, no S3) skip — cutting this job's multiregion cost from
      # ~104s to ~19s. Those perf tests run in their own lane, not here.
      - name: Run integration tests
        run: go test -tags integration -short ./... -timeout 15m

  test-race:
    name: Test with Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test ./... -short -race -timeout=15m

  fuzz:
    name: Fuzz (short burst)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # Runs each fuzz target for a short burst to catch new crashers beyond the
      # committed seed corpus (which the -short jobs already execute as unit
      # tests). -fuzz runs one target per package invocation, so iterate. Kept
      # brief to stay on the PR critical path; the corpus grows over time via
      # developers running longer local sessions and the weekly deep lane in
      # fuzz-deep.yml, which runs the same targets for ~40x longer. (#238 Phase 4)
      #
      # Budget is an execution COUNT, not a wall-clock duration: a duration
      # -fuzztime lets the fuzzing coordinator race its own deadline on a
      # contended runner and fail with a spurious "context deadline exceeded"
      # (not a real crasher). A count has no time-based context, so that flake
      # cannot occur while still exercising ~500k inputs per target.
      - name: Fuzz manifest + chunking targets
        run: |
          set -euo pipefail
          fuzz_pkg() {
            local pkg="$1"; shift
            for target in "$@"; do
              echo "::group::$pkg $target"
              go test "$pkg" -run '^$' -fuzz "^${target}$" -fuzztime 500000x
              echo "::endgroup::"
            done
          }
          fuzz_pkg ./pkg/manifest/ \
            FuzzFromJSON FuzzFromJSONAuto FuzzManifestRoundTrip FuzzParseS3URL \
            FuzzRestorePath FuzzResolveObjectKey FuzzValidateAgainstSchema
          fuzz_pkg ./pkg/chunking/ FuzzCreateChunks

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          args: --timeout=10m

  # Security scanning (govulncheck, gitleaks, trivy, semgrep) lives in
  # security.yml. Removed the duplicate govulncheck-only job here.

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test ./... -short -coverprofile=coverage.out -covermode=atomic -timeout=10m

      # Per-package coverage ratchet (#238 Phase 6): enforce that no package
      # regressed below its floor in .coverage-baseline. Reuses the profile just
      # generated. This is CI's only hard coverage gate (Codecov below is
      # informational, continue-on-error).
      - name: Enforce coverage ratchet
        run: bash scripts/ci/coverage-ratchet.sh --profile coverage.out --check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # v7 dropped the singular "file" input in favour of "files".
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
            coverage.txt
          retention-days: 30
