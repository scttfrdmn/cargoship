name: Doc Consistency

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'CLAUDE.md'
      - 'docs/**'
      # The canonical version source: a release bump touching only this file would
      # otherwise skip this workflow at exactly the moment the doc tables go stale.
      - 'internal/version/version.txt'
      - 'scripts/ci/check-doc-versions.sh'
      - '.github/workflows/doc-consistency.yml'
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'ROADMAP.md'
      - 'CLAUDE.md'
      - 'docs/**'
      # The canonical version source: a release bump touching only this file would
      # otherwise skip this workflow at exactly the moment the doc tables go stale.
      - 'internal/version/version.txt'
      - 'scripts/ci/check-doc-versions.sh'
      - '.github/workflows/doc-consistency.yml'

permissions:
  contents: read

jobs:
  check:
    name: Docs match the current release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # need full tag history for the version check
      - name: Check doc version consistency
        run: ./scripts/ci/check-doc-versions.sh
