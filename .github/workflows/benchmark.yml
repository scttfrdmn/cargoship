name: Performance Benchmarks

on:
  # Run on pull requests
  pull_request:
    branches: [ main ]
    paths:
      - 'pkg/pipeline/**'
      - 'pkg/compression/**'
      - 'pkg/chunking/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'

  # Run nightly for tracking trends
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario'
        required: true
        default: 'small'
        type: choice
        options:
          - small
          - medium
          - large

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build CargoShip
        run: |
          go build -o cargoship ./cmd/cargoship

      - name: Install s5cmd
        run: |
          wget https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz
          tar xzf s5cmd_2.2.2_Linux-64bit.tar.gz
          sudo mv s5cmd /usr/local/bin/
          s5cmd version

      - name: Install MinIO mc
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/
          mc --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Run benchmark
        id: benchmark
        env:
          CARGOSHIP_BENCHMARK_BUCKET: ${{ secrets.BENCHMARK_BUCKET }}
          SCENARIO: ${{ github.event.inputs.scenario || 'small' }}
        run: |
          cd benchmarks/cargohold
          make build
          make run SCENARIO=$SCENARIO

      - name: Check for regression
        id: regression
        run: |
          cd benchmarks/cargohold
          if [ -f results/regression/*_regression.json ]; then
            echo "regression_found=true" >> $GITHUB_OUTPUT
          else
            echo "regression_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/cargohold/results/*.json
            benchmarks/cargohold/results/*.html
            benchmarks/cargohold/results/*.txt
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './benchmarks/cargohold/results';

            // Find latest report
            const files = fs.readdirSync(path);
            const txtFile = files.find(f => f.endsWith('_report.txt'));

            if (!txtFile) {
              console.log('No report found');
              return;
            }

            const report = fs.readFileSync(`${path}/${txtFile}`, 'utf8');

            const comment = `## 🚀 Performance Benchmark Results

            \`\`\`
            ${report}
            \`\`\`

            Full results available in artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on regression
        if: steps.regression.outputs.regression_found == 'true'
        run: |
          echo "❌ Performance regression detected!"
          exit 1

  trend-analysis:
    name: Trend Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: benchmark

    steps:
      - name: Download historical results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: ./historical

      - name: Analyze trends
        run: |
          echo "📊 Analyzing performance trends..."
          # TODO: Implement trend analysis
          # - Load historical results
          # - Calculate moving averages
          # - Detect long-term trends
          # - Alert on degradation

      - name: Generate trend report
        run: |
          echo "📈 Generating trend report..."
          # TODO: Generate charts showing performance over time
