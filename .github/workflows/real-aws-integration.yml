name: Real-AWS Integration

# Runs the credential-gated real-AWS integration suites against a real S3 bucket
# in a dedicated dev account. This is intentionally NOT a PR job — it needs real
# credentials and mutates a real bucket, so it runs on a schedule / at release
# rather than slowing every pull request. The emulator-based integration job in
# test.yml already guards every PR credential-free.
#
# Trigger model: weekly + on release. It does NOT run on every push to main —
# the emulator lane covers per-change correctness, and real-AWS runs are
# reserved for (1) a weekly canary that catches environmental drift (AWS
# API/behavior changes, pinned-action rot) and (2) every release tag, so a
# published version is always validated against real S3. Manual dispatch stays
# available for on-demand runs.
#
# Credentials are obtained via GitHub OIDC (no long-lived keys). The job is a
# no-op unless the repository provides the role + bucket, so forks and clones
# without the secrets configured don't fail:
#   - secret AWS_CI_ROLE_ARN   — IAM role to assume via OIDC (dev account)
#   - variable AWS_CI_REGION   — region (defaults to us-east-1)
#   - variable AWS_CI_BUCKET   — pre-existing test bucket
# See #289 for standing up a dedicated cargoship-dev account for this.

on:
  schedule:
    # Weekly canary, Mondays 07:00 UTC — catches environmental drift with no
    # code change (external API/behavior shifts, action rot).
    - cron: '0 7 * * 1'
  push:
    # Every release tag — a published version is always validated on real S3.
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC role assumption
  contents: write # attach the verification report to the release on tag runs

# Serialize runs: the suite mutates a single shared test bucket, so two
# concurrent runs (e.g. a release tag landing during the weekly canary) could
# corrupt each other's objects. Queue instead of cancelling so both complete.
concurrency:
  group: real-aws-integration
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  real-aws:
    name: Real-AWS integration (dev account)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for AWS role configuration
        id: guard
        env:
          ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "AWS_CI_ROLE_ARN not set — skipping real-AWS suite (expected on forks)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_CI_REGION || 'us-east-1' }}

      - name: Download dependencies
        if: steps.guard.outputs.configured == 'true'
        run: go mod download

      # Runs the whole //go:build integration suite against real S3 (the trust
      # epic's evidence, #270). Credentials come from the OIDC step's default
      # chain (no AWS_PROFILE); the bucket from CARGOSHIP_TEST_BUCKET. Suites
      # that don't touch S3 (or gate on the emulator / other opt-ins) self-skip
      # — e.g. pkg/multiregion needs multi-region bucket-creating creds and a
      # coordinator S3 write path (#296), gated behind
      # CARGOSHIP_ENABLE_MULTIREGION_TESTS.
      #
      # -p 1 (serial packages): all suites share the single CARGOSHIP_TEST_BUCKET,
      # and pkg/aws/s3's cleanup wipes the whole bucket. Running packages in
      # parallel (the default) lets one package's cleanup delete another's
      # in-flight objects → spurious NoSuchBucket/missing-object failures. Serial
      # execution isolates them on the shared bucket.
      - name: Run real-AWS integration tests
        if: steps.guard.outputs.configured == 'true'
        env:
          CARGOSHIP_ENABLE_S3_INTEGRATION_TESTS: '1'
          CARGOSHIP_ENABLE_AWS_INTEGRATION_TESTS: 'true'
          CARGOSHIP_TEST_BUCKET: ${{ vars.AWS_CI_BUCKET }}
          AWS_REGION: ${{ vars.AWS_CI_REGION || 'us-east-1' }}
        # Tee the verbose output to a log so the verification report is generated
        # from the exact run that gated the release — no second execution, and
        # the published numbers can't drift from what actually passed. -v is
        # required for the VERIFICATION_EVIDENCE markers (t.Logf) to appear.
        # pipefail (default in bash) makes the step fail if go test fails even
        # though it's piped through tee.
        run: |
          set -o pipefail
          go test -tags integration -p 1 -v ./... -timeout 30m 2>&1 | tee /tmp/integration.log

      # Turn the transient CI run into durable, dated evidence (#270 leg 3,
      # sub-issue #5). Always runs — even on failure — so a red release still
      # publishes an honest FAILED report. The report reflects the log above.
      - name: Generate verification report
        if: steps.guard.outputs.configured == 'true' && always()
        id: report
        run: |
          ver="${GITHUB_REF_NAME}"
          case "$ver" in v*) : ;; *) ver="$(git describe --tags --always)" ;; esac
          date="$(date -u +%Y-%m-%d)"
          mkdir -p reports/verification
          out="reports/verification/${ver}-${date}.md"
          # Don't let a non-zero report exit (FAILED run) abort the step; we
          # want the artifact uploaded regardless.
          bash scripts/ci/verification-report.sh \
            -i /tmp/integration.log -v "$ver" -d "$date" -c "$GITHUB_SHA" -o "$out" || true
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "----- verification report -----"
          cat "$out"

      - name: Upload verification report artifact
        if: steps.guard.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-report
          path: ${{ steps.report.outputs.path }}
          if-no-files-found: warn

      # On release tags, attach the dated report to the GitHub Release so the
      # published version carries its own standing integrity evidence.
      - name: Attach report to release
        if: steps.guard.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/v') && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.report.outputs.path }}" --clobber \
            || echo "release ${GITHUB_REF_NAME} not found yet — artifact still available in workflow run"
