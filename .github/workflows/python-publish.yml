name: Publish dvc-cargoship to PyPI

# Triggers:
#   - Pull request touching dvc-cargoship/: run tests, build the wheel/sdist,
#     and validate the artifacts with `twine check` (no upload — PRs never
#     publish, so nothing irreversible happens off a PR).
#   - Tag  dvc-cargoship/v*.*.*          : publish the release wheel to PyPI.

on:
  push:
    tags:
      - 'dvc-cargoship/v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'dvc-cargoship/**'
      - '.github/workflows/python-publish.yml'

defaults:
  run:
    working-directory: dvc-cargoship

jobs:
  # -----------------------------------------------------------------------
  # test — always runs (PR and tag)
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # build — produce the wheel and sdist as artifacts
  # -----------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dvc-cargoship/dist/
          retention-days: 7

  # -----------------------------------------------------------------------
  # validate — runs on PR: check the built artifacts without publishing
  # -----------------------------------------------------------------------
  validate:
    name: Validate distribution
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install twine
        run: pip install twine

      - name: Check wheel and sdist metadata
        # Artifacts land at the workspace root, not under the default
        # working-directory (dvc-cargoship).
        working-directory: ${{ github.workspace }}
        run: twine check dist/*

  # -----------------------------------------------------------------------
  # publish-pypi — runs on version tag push
  # -----------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dvc-cargoship/v')
    environment:
      name: pypi
      url: https://pypi.org/p/dvc-cargoship

    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- Docker action: its image is FROM ghcr.io/...:${GITHUB_ACTION_REF}, so a commit SHA yields "manifest unknown". The immutable release tag is the correct pin here.
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          packages-dir: dist/
