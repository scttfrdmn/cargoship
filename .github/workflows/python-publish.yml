name: Publish dvc-cargoship to PyPI

# Triggers:
#   - Pull request touching dvc-cargoship/: run tests, build the wheel/sdist,
#     and validate the artifacts with `twine check` (no upload — PRs never
#     publish, so nothing irreversible happens off a PR).
#   - Tag  dvc-cargoship/v*.*.*          : publish the release wheel to PyPI.

on:
  push:
    tags:
      - 'dvc-cargoship/v*.*.*'
  pull_request:
    branches:
      - main
    paths:
      - 'dvc-cargoship/**'
      - '.github/workflows/python-publish.yml'

defaults:
  run:
    working-directory: dvc-cargoship

jobs:
  # -----------------------------------------------------------------------
  # test — always runs (PR and tag)
  # -----------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package and dev dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # build — produce the wheel and sdist as artifacts
  # -----------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dvc-cargoship/dist/
          retention-days: 7

  # -----------------------------------------------------------------------
  # validate — runs on PR: check the built artifacts without publishing
  # -----------------------------------------------------------------------
  validate:
    name: Validate distribution
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # This job doesn't check out the repo, so the default
      # working-directory (dvc-cargoship) doesn't exist. Run at the workspace
      # root, where the downloaded artifacts land.
      - name: Install twine
        working-directory: ${{ github.workspace }}
        run: pip install twine

      - name: Check wheel and sdist metadata
        working-directory: ${{ github.workspace }}
        run: twine check dist/*

  # -----------------------------------------------------------------------
  # publish-pypi — runs on version tag push
  # -----------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dvc-cargoship/v')
    environment:
      name: pypi
      url: https://pypi.org/p/dvc-cargoship

    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- Docker action: its image is FROM ghcr.io/...:${GITHUB_ACTION_REF}, so a commit SHA yields "manifest unknown". The immutable release tag is the correct pin here.
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/
