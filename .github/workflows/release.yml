name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      # The pushed tag must match the canonical version (internal/version/
      # version.txt). This closes the loop on the single-source-of-truth: docs
      # are checked against version.txt in CI, and the release tag is checked
      # against it here, so tag == version.txt == docs always holds.
      - name: Verify tag matches internal/version/version.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < internal/version/version.txt)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match internal/version/version.txt (v${file}); bump version.txt before tagging"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version.txt (v${file})"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
