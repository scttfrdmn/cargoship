name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# id-token: write is the one that deserves a second look — it lets this job mint
# a short-lived OIDC token asserting its own identity. Keyless signing needs it:
# cosign exchanges that token with Fulcio for a signing certificate, which is what
# ties the signature to *this workflow in this repository* rather than to a key
# somebody could steal. The alternative is a long-lived private key in a secret,
# which is a worse trade — it can leak, has to be rotated, and proves only
# possession rather than provenance.
#
# The token expires in minutes and grants no repository write access of its own.
# It is declared on the `goreleaser` JOB rather than workflow-wide (#381): this
# workflow used to have exactly one job, which made workflow-level scoping
# equivalent, but the notarization and publish jobs neither sign nor need to
# assert an identity. Granting them a signing token would be unnecessary
# privilege for no benefit.
#
# `packages: write` used to be here and is gone (#360): nothing in this release
# publishes to a package registry. `.goreleaser.yml` has no dockers:/kos:/nfpms:
# stanza (the dockers: block is commented out), and brews:/scoops: push to
# separate repositories with their own PATs rather than GITHUB_TOKEN. Least
# privilege matters more than usual right here, because the block above argues for
# *widening* permissions with id-token: write — an argument that is only as strong
# as the claim that everything else in this list is justified.
#
# contents: write stays workflow-level: all three jobs need it (draft creation,
# downloading the draft's assets, promotion).
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Only this job runs cosign, so only this job can mint an OIDC token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # The pushed tag must match the canonical version (internal/version/
      # version.txt). This closes the loop on the single-source-of-truth: docs
      # are checked against version.txt in CI, and the release tag is checked
      # against it here, so tag == version.txt == docs always holds.
      - name: Verify tag matches internal/version/version.txt
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < internal/version/version.txt)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match internal/version/version.txt (v${file}); bump version.txt before tagging"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version.txt (v${file})"

      # cosign signs checksums.txt (see the signs: stanza in .goreleaser.yml) and
      # syft generates a per-archive SBOM. Both are invoked BY goreleaser, so they
      # must be on PATH before it runs — a missing binary fails the release after
      # the artifacts are already built.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # `--draft` (#360). The release is assembled but NOT public until the
      # verification step below passes, so a broken provenance chain cannot reach
      # users at all — previously the verify step ran after publication and could
      # only report a bad release retroactively, which is a strange property for a
      # check whose purpose is to prevent shipping unverifiable artifacts.
      #
      # Passed as a flag rather than `release.draft: true` in .goreleaser.yml on
      # purpose: a local `goreleaser release` should not silently produce drafts,
      # and this way the draft state lives next to the step that clears it.
      #
      # The Homebrew tap and Scoop bucket still publish in THIS run, which is a
      # deliberate choice rather than an oversight. Deferring them to a second
      # goreleaser invocation after promotion does not work, and I checked rather
      # than assumed:
      #
      #   * there is no `goreleaser publish` or `goreleaser continue` subcommand —
      #     `goreleaser publish --help` prints the *release* help, because the root
      #     command falls through, exactly as it does for a nonsense subcommand
      #   * `release.skip_upload: true` does NOT make a second `release` run leave
      #     the GitHub release alone. Verified with a dummy token: the log shows
      #     "skipped http upload" and then "release creation failed … POST
      #     /repos/…/releases", i.e. it skips only the ASSETS and still creates or
      #     replaces the release. With `mode: replace` that would delete and
      #     re-upload the assets whose signature was just verified — turning a
      #     safety measure into the thing that breaks the release
      #
      # Publishing the taps here is safe because the formula is correct
      # independently of draft state: it pins `releases/download/<tag>/…` URLs, and
      # the tag is fixed before this workflow starts. Those URLs simply begin
      # resolving when the release is promoted seconds later. The failure mode is a
      # brief 404 for anyone who runs `brew install` inside the verification window,
      # not a wrong formula — and if verification fails, a formula pointing at a
      # release that was never published is a far better outcome than the previous
      # behaviour, where the artifacts themselves were already public.
      # A release must not silently ship unnotarized darwin binaries. The
      # `notarize:` stanza is gated on `isEnvSet "MACOS_SIGN_P12"` so that forks
      # and local snapshot builds work without credentials — which means a
      # missing or misnamed secret here would make goreleaser skip signing and
      # still report success. That is the one failure mode this whole change
      # exists to prevent, so assert the material is present before building.
      # (Deliberately not `if:` on the step — a skipped step is invisible in the
      # summary, whereas this fails the release with a named cause.)
      - name: Verify macOS signing material is present
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID \
                      MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            # Indirect expansion, so the VALUE is never echoed — only the name.
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${#missing[@]} macOS signing secret(s) missing: ${missing[*]}"
            echo "Without these, goreleaser skips notarization and the darwin"
            echo "binaries ship adhoc-signed — Gatekeeper SIGKILLs those under"
            echo "quarantine. See the notarize: stanza in .goreleaser.yml."
            exit 1
          fi
          echo "all 5 macOS signing secrets are present"

      - name: Run GoReleaser (draft)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          # Consumed by the notarize: stanza in .goreleaser.yml. The .p12 and the
          # .p8 are base64 so they survive as environment variables; goreleaser
          # decodes both. Never logged — goreleaser masks them, and the check
          # above prints names only.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Verify the release the way a user would — same command and identity flags
      # documented in SECURITY.md. A signature nobody has verified is an
      # assumption, and this is the cheapest place to discover a wrong identity or
      # issuer string: before anyone can download it.
      #
      # Downloads the assets back from the draft rather than verifying `dist/`
      # (#360). Verifying the local build directory proves the signing step worked;
      # it does NOT prove that what landed on the release is the same bytes. A
      # truncated or mis-mapped upload would pass a dist/-only check and still hand
      # users an artifact that fails `cosign verify-blob`. Round-tripping through
      # the API closes that gap, and it is only possible because the release is
      # still a draft.
      #
      # Re-checking the digests is what makes one signature cover everything:
      # checksums.txt is the signed file, so if it verifies AND its digests match
      # the downloaded artifacts, the whole release is covered.
      - name: Verify the draft's published assets before promoting
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          EXPECTED_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify && cd verify
          # `gh release download` reaches draft releases with contents: write.
          gh release download "$TAG" --clobber
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          # --ignore-missing skips the signature bundle, which is not itself listed
          # in checksums.txt. Guard against that silently ignoring EVERYTHING: if a
          # rename ever desynchronised the names, --check would report "0 checked"
          # and still exit 0.
          checked=$(sha256sum --check --ignore-missing checksums.txt | grep -c ': OK$')
          expected=$(grep -c . checksums.txt)
          echo "verified ${checked}/${expected} digests from the published assets"
          if [ "$checked" -ne "$expected" ]; then
            echo "::error::checksums.txt lists ${expected} artifacts but only ${checked} were verified"
            exit 1
          fi
          {
            echo "### Release provenance"
            echo ""
            echo "Assets downloaded back from the draft release and verified against:"
            echo ""
            echo '```'
            echo "$EXPECTED_IDENTITY"
            echo '```'
            echo ""
            echo "${checked}/${expected} digests confirmed; $(grep -c 'sbom.json' checksums.txt) SBOM(s) attached."
          } >> "$GITHUB_STEP_SUMMARY"

  # Prove the darwin artifacts are actually notarized, before promotion (#381).
  #
  # A separate job because this is the one thing that CANNOT run on ubuntu:
  # codesign, spctl and the quarantine bit are macOS-only. It downloads the
  # draft's real artifacts rather than inspecting dist/ — same reasoning as the
  # provenance step above. Inspecting the build directory proves the signing step
  # ran; only the published archive proves users get a signed binary.
  #
  # This gates `publish`, so a release that would be SIGKILLed on a user's Mac
  # never becomes public.
  notarization:
    needs: goreleaser
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both darwin architectures. arm64 is what most Macs run now; x86_64 still
      # ships, and signing is per-binary, so one being correct says nothing about
      # the other.
      - name: Verify darwin binaries are signed and notarized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Execute the quarantined binary, not just inspect its metadata. Safe to
          # enable here and off by default locally: an unnotarized binary raises a
          # Gatekeeper popup, which is noise on a jobless runner and jarring on a
          # developer's desktop.
          QUARANTINE_PROBE: '1'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          rm -rf notarize-check && mkdir notarize-check && cd notarize-check
          for arch in arm64 x86_64; do
            asset="cargoship_${version}_darwin_${arch}.tar.gz"
            echo "::group::$asset"
            gh release download "$TAG" --pattern "$asset" --clobber
            rm -f cargoship
            tar xzf "$asset" cargoship
            bash ../scripts/ci/check-macos-notarization.sh ./cargoship
            echo "::endgroup::"
          done

  publish:
    needs: notarization
    runs-on: ubuntu-latest
    steps:
      # Only now is the release public. Everything above can fail without a user
      # ever seeing an unverifiable artifact, which is the entire point of #360.
      #
      # `prerelease: auto` in .goreleaser.yml already marked the draft as a
      # prerelease if the tag has a suffix; --draft=false alone does not touch that
      # flag, so the distinction survives promotion.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # --verify-tag: refuse to publish if the tag somehow is not on the
          # remote. It always is here (this workflow triggers on a tag push), which
          # is why promotion cannot invent a release for a tag nobody pushed.
          gh release edit "$TAG" --draft=false --verify-tag
          state=$(gh release view "$TAG" --json isDraft,isPrerelease -q '"draft=\(.isDraft) prerelease=\(.isPrerelease)"')
          echo "published: $state"
          case "$state" in
            draft=false*) ;;
            *) echo "::error::release $TAG is still a draft after promotion"; exit 1 ;;
          esac
