name: Performance Benchmarks

on:
  # Run on pushes to main branch
  push:
    branches:
      - main

  # Run on pull requests
  pull_request:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - short
          - long

  # Run weekly to track performance over time
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  GO_VERSION: '1.27.4'

jobs:
  # #881 acceptance: on a long, lossy path, BBR set per socket through cargoship's
  # dialer must clearly beat CUBIC. Shapes loopback only, in its own job, so no
  # other test sees the delay. Non-blocking, like the rest of this workflow.
  congestion-ab:
    name: Congestion control A/B (netem)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Loopback's 64 KB MTU makes each netem "packet" a 64 KB GSO super-segment,
      # which caps both algorithms near one segment per RTT (first run: cubic
      # 5.2 vs bbr 5.1 Mbps). Use a real MTU, a netem queue deep enough for the
      # bandwidth-delay product, and buffers that don't bind before the
      # congestion controller does.
      - name: Allow BBR and shape loopback (+100 ms RTT, 0.1% loss)
        run: |
          sudo modprobe tcp_bbr
          sudo sysctl -w net.ipv4.tcp_allowed_congestion_control="reno cubic bbr"
          sudo ip link set dev lo mtu 1500
          sudo sysctl -w net.core.rmem_max=67108864 net.core.wmem_max=67108864
          sudo sysctl -w net.ipv4.tcp_rmem="4096 131072 67108864" net.ipv4.tcp_wmem="4096 131072 67108864"
          sudo tc qdisc add dev lo root netem delay 50ms loss 0.1% limit 1000000
          tc qdisc show dev lo

      - name: Run the A/B
        env:
          CARGOSHIP_NETEM_AB: '1'
        run: go test -count=1 -run TestCongestionControlNetemAB -v ./pkg/aws/config/

  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write  # To post comments on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Determine benchmark type
        id: benchmark-type
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.benchmark_type }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "type=short" >> "$GITHUB_OUTPUT"
          else
            echo "type=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        id: benchmarks
        run: |
          mkdir -p profiles benchmark-reports

          case "${{ steps.benchmark-type.outputs.type }}" in
            short)
              echo "Running short benchmarks..."
              ./scripts/run-benchmarks.sh --short
              ;;
            long)
              echo "Running long benchmarks..."
              ./scripts/run-benchmarks.sh --long
              ;;
            *)
              echo "Running all benchmarks..."
              ./scripts/run-benchmarks.sh
              ;;
          esac

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark-reports/*.txt
            profiles/*.prof
            profiles/*.out
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find latest report
            const reportDir = 'benchmark-reports';
            let files = [];
            try {
              files = fs.readdirSync(reportDir)
                .filter(f => f.startsWith('benchmark-') && f.endsWith('.txt'))
                .sort()
                .reverse();
            } catch (e) {
              console.log('No benchmark-reports directory found');
              return;
            }

            if (files.length === 0) {
              console.log('No benchmark reports found');
              return;
            }

            const reportPath = path.join(reportDir, files[0]);
            const reportContent = fs.readFileSync(reportPath, 'utf8');

            // Extract key metrics
            const benchmarkLines = reportContent.split('\n')
              .filter(line => line.startsWith('Benchmark'));

            // Create summary
            let summary = '## Performance Benchmark Results\n\n';
            summary += `Benchmark run completed. ${benchmarkLines.length} scenarios tested.\n\n`;
            summary += '<details>\n<summary>View Results</summary>\n\n';
            summary += '```\n';
            summary += benchmarkLines.slice(0, 20).join('\n');
            if (benchmarkLines.length > 20) {
              summary += `\n... and ${benchmarkLines.length - 20} more\n`;
            }
            summary += '\n```\n\n';
            summary += '</details>\n\n';
            summary += `Full results available in workflow artifacts.\n`;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
