name: Performance Benchmarks

on:
  # Run on pushes to main branch
  push:
    branches:
      - main

  # Run on pull requests
  pull_request:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - short
          - long

  # Run weekly to track performance over time
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  GO_VERSION: '1.24'
  AWS_REGION: 'us-west-2'
  BENCHMARK_BUCKET: 'cargoship-ci-benchmarks'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Only run on main repo, not forks (requires AWS credentials)
    if: github.repository == 'scttfrdmn/cargoship'

    permissions:
      contents: read
      id-token: write  # Required for OIDC auth to AWS
      pull-requests: write  # To post comments on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Access
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ env.BENCHMARK_BUCKET }} || aws s3 mb s3://${{ env.BENCHMARK_BUCKET }}

      - name: Download dependencies
        run: go mod download

      - name: Download baseline
        id: download-baseline
        continue-on-error: true
        run: |
          # Try to download baseline from S3
          if aws s3 cp s3://${{ env.BENCHMARK_BUCKET }}/baseline.json pkg/benchmarks/baseline.json; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
            echo "Downloaded baseline from S3"
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
            echo "No baseline found in S3"
          fi

      - name: Determine benchmark type
        id: benchmark-type
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "type=${{ inputs.benchmark_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "type=short" >> $GITHUB_OUTPUT
          else
            echo "type=all" >> $GITHUB_OUTPUT
          fi

      - name: Run benchmarks
        id: benchmarks
        run: |
          mkdir -p profiles benchmark-reports

          case "${{ steps.benchmark-type.outputs.type }}" in
            short)
              echo "Running short benchmarks..."
              ./scripts/run-benchmarks.sh --short
              ;;
            long)
              echo "Running long benchmarks..."
              ./scripts/run-benchmarks.sh --long
              ;;
            *)
              echo "Running all benchmarks..."
              ./scripts/run-benchmarks.sh
              ;;
          esac

      - name: Detect regressions
        if: steps.download-baseline.outputs.baseline_exists == 'true'
        id: regressions
        continue-on-error: true
        run: |
          # TODO: Implement programmatic regression detection
          # For now, this is a placeholder
          echo "Regression detection not yet implemented"
          echo "has_regressions=false" >> $GITHUB_OUTPUT

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark-reports/*.txt
            profiles/*.prof
            profiles/*.out
          retention-days: 30

      - name: Save baseline (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Upload latest results as new baseline
          LATEST_REPORT=$(ls -t benchmark-reports/benchmark-*.txt | head -1)
          if [ -f "$LATEST_REPORT" ]; then
            # TODO: Convert benchmark results to baseline JSON format
            # For now, just archive the report
            aws s3 cp "$LATEST_REPORT" "s3://${{ env.BENCHMARK_BUCKET }}/baseline-$(date +%Y%m%d).txt"
            echo "Saved baseline to S3"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find latest report
            const reportDir = 'benchmark-reports';
            const files = fs.readdirSync(reportDir)
              .filter(f => f.startsWith('benchmark-') && f.endsWith('.txt'))
              .sort()
              .reverse();

            if (files.length === 0) {
              console.log('No benchmark reports found');
              return;
            }

            const reportPath = path.join(reportDir, files[0]);
            const reportContent = fs.readFileSync(reportPath, 'utf8');

            // Extract key metrics
            const benchmarkLines = reportContent.split('\n')
              .filter(line => line.startsWith('Benchmark'));

            // Create summary
            let summary = '## 🎯 Performance Benchmark Results\n\n';
            summary += `Benchmark run completed. ${benchmarkLines.length} scenarios tested.\n\n`;
            summary += '<details>\n<summary>View Results</summary>\n\n';
            summary += '```\n';
            summary += benchmarkLines.slice(0, 20).join('\n');
            if (benchmarkLines.length > 20) {
              summary += `\n... and ${benchmarkLines.length - 20} more\n`;
            }
            summary += '\n```\n\n';
            summary += '</details>\n\n';
            summary += `Full results available in workflow artifacts.\n`;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

  # Separate job for regression analysis (can be extended later)
  analyze-trends:
    name: Analyze Performance Trends
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download historical baselines
        run: |
          mkdir -p historical-baselines
          aws s3 sync s3://${{ env.BENCHMARK_BUCKET }}/ historical-baselines/ \
            --exclude "*" --include "baseline-*.txt"

      - name: Analyze trends
        run: |
          echo "Performance trend analysis"
          echo "Historical baselines:"
          ls -lh historical-baselines/ || echo "No historical data"

          # TODO: Implement trend analysis
          # - Compare against previous runs
          # - Detect gradual performance degradation
          # - Generate performance charts
