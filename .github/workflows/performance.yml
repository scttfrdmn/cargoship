name: Performance Benchmarks

on:
  # Run on pushes to main branch
  push:
    branches:
      - main

  # Run on pull requests
  pull_request:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark type to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - short
          - long

  # Run weekly to track performance over time
  schedule:
    # Every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  GO_VERSION: '1.26'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write  # To post comments on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Determine benchmark type
        id: benchmark-type
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.benchmark_type }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "type=short" >> "$GITHUB_OUTPUT"
          else
            echo "type=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        id: benchmarks
        run: |
          mkdir -p profiles benchmark-reports

          case "${{ steps.benchmark-type.outputs.type }}" in
            short)
              echo "Running short benchmarks..."
              ./scripts/run-benchmarks.sh --short
              ;;
            long)
              echo "Running long benchmarks..."
              ./scripts/run-benchmarks.sh --long
              ;;
            *)
              echo "Running all benchmarks..."
              ./scripts/run-benchmarks.sh
              ;;
          esac

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmark-reports/*.txt
            profiles/*.prof
            profiles/*.out
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find latest report
            const reportDir = 'benchmark-reports';
            let files = [];
            try {
              files = fs.readdirSync(reportDir)
                .filter(f => f.startsWith('benchmark-') && f.endsWith('.txt'))
                .sort()
                .reverse();
            } catch (e) {
              console.log('No benchmark-reports directory found');
              return;
            }

            if (files.length === 0) {
              console.log('No benchmark reports found');
              return;
            }

            const reportPath = path.join(reportDir, files[0]);
            const reportContent = fs.readFileSync(reportPath, 'utf8');

            // Extract key metrics
            const benchmarkLines = reportContent.split('\n')
              .filter(line => line.startsWith('Benchmark'));

            // Create summary
            let summary = '## Performance Benchmark Results\n\n';
            summary += `Benchmark run completed. ${benchmarkLines.length} scenarios tested.\n\n`;
            summary += '<details>\n<summary>View Results</summary>\n\n';
            summary += '```\n';
            summary += benchmarkLines.slice(0, 20).join('\n');
            if (benchmarkLines.length > 20) {
              summary += `\n... and ${benchmarkLines.length - 20} more\n`;
            }
            summary += '\n```\n\n';
            summary += '</details>\n\n';
            summary += `Full results available in workflow artifacts.\n`;

            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
