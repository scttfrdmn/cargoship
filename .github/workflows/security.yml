name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec-results.sarif ./...'
    
    - name: Upload Gosec results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: gosec-results.sarif
    
    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/golang
          p/owasp-top-ten
          p/cwe-top-25
    
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Run Nancy (Go dependency scanner)
      run: |
        go install github.com/sonatypecommunity/nancy@latest
        go list -json -deps ./... | nancy sleuth
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Check for known vulnerabilities with Snyk
      uses: snyk/actions/golang@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
    
    - name: Run GitLeaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install go-licenses
      run: go install github.com/google/go-licenses@latest
    
    - name: Check licenses
      run: |
        go-licenses check ./...
        go-licenses csv ./... > licenses.csv
    
    - name: Upload license report
      uses: actions/upload-artifact@v3
      with:
        name: license-report
        path: licenses.csv

  security-build:
    name: Security-hardened Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build with security flags
      run: |
        # Build with security-hardened flags
        CGO_ENABLED=0 GOOS=linux go build \
          -a -installsuffix cgo \
          -ldflags '-w -s -extldflags "-static"' \
          -trimpath \
          -buildvcs=false \
          -o cargoship-secure \
          ./cmd/cargoship
    
    - name: Run security analysis on binary
      run: |
        # Check for hardening features
        readelf -h cargoship-secure
        
        # Check for stack protection
        readelf -W -S cargoship-secure | grep -E "(stack|canary)"
        
        # Check for position independent executable
        readelf -h cargoship-secure | grep "DYN"
    
    - name: Scan binary with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: './cargoship-secure'
        format: 'table'

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t cargoship:security-test -f Dockerfile.security .
    
    - name: Run Trivy container scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'cargoship:security-test'
        format: 'sarif'
        output: 'trivy-container.sarif'
    
    - name: Upload container scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-container.sarif'
    
    - name: Run Dockle security linter
      run: |
        curl -L -o dockle.deb https://github.com/goodwithtech/dockle/releases/latest/download/dockle_linux-amd64.deb
        sudo dpkg -i dockle.deb
        dockle cargoship:security-test

  crypto-analysis:
    name: Cryptographic Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install crypto analysis tools
      run: |
        go install github.com/securecodewarrior/crypto-detector@latest
    
    - name: Analyze cryptographic usage
      run: |
        # Look for weak crypto usage
        grep -r "md5\|sha1\|des\|3des\|rc4" . --include="*.go" || true
        
        # Check for hardcoded keys/secrets
        grep -r "-----BEGIN.*KEY-----" . --include="*.go" || true
        
        # Verify proper random number generation
        grep -r "math/rand" . --include="*.go" || true
    
    - name: GPG key validation
      run: |
        # Validate GPG key generation code
        cd pkg/gpg
        go test -v -run TestKeyGeneration
        go test -v -run TestEncryption

  compliance-check:
    name: Compliance Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate security documentation
      run: |
        # Check if security docs exist and are up to date
        test -f docs/SECURITY.md
        test -f docs/USER_GUIDE.md
        
        # Verify security configuration examples
        find . -name "*.yaml" -o -name "*.yml" | xargs grep -l "security:" || true
    
    - name: Check for security headers
      run: |
        # Validate that security headers are implemented
        grep -r "X-Content-Type-Options\|X-Frame-Options\|X-XSS-Protection" . --include="*.go" || true
    
    - name: Audit trail validation
      run: |
        # Check for proper audit logging
        grep -r "audit\|log.*security" . --include="*.go" || true

  security-test:
    name: Security Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Run security-focused tests
      run: |
        # Run tests with race detection
        go test -race -v ./...
        
        # Run tests with coverage for security-critical packages
        go test -coverprofile=security-coverage.out -v ./pkg/gpg/...
        go test -coverprofile=crypto-coverage.out -v ./pkg/compression/...
        
        # Check coverage thresholds for security packages
        go tool cover -func=security-coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{if($1<80) exit 1}'

  penetration-test:
    name: Basic Penetration Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' # Only run on scheduled builds
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up test environment
      run: |
        # Build the application
        go build -o cargoship ./cmd/cargoship
        
        # Start test server (if applicable)
        # ./cargoship server --test-mode &
    
    - name: Run security tests
      run: |
        # Test for common vulnerabilities
        echo "Running basic security tests..."
        
        # Test command injection resistance
        ./cargoship --help > /dev/null
        
        # Test path traversal resistance
        ./cargoship create "../../../etc/passwd" --bucket test 2>/dev/null || true
        
        # Test buffer overflow resistance with long inputs
        ./cargoship create "$(python3 -c 'print("A"*10000)')" --bucket test 2>/dev/null || true

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-scan, secrets-scan, security-test]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-report.md
        echo "Date: $(date)" >> security-report.md
        echo "Commit: ${{ github.sha }}" >> security-report.md
        echo "" >> security-report.md
        
        echo "## Scan Results" >> security-report.md
        echo "- Static Analysis: ${{ needs.static-analysis.result }}" >> security-report.md
        echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
        echo "- Secrets Scan: ${{ needs.secrets-scan.result }}" >> security-report.md
        echo "- Security Tests: ${{ needs.security-test.result }}" >> security-report.md
        echo "" >> security-report.md
        
        echo "## Recommendations" >> security-report.md
        echo "- Review any failed scans above" >> security-report.md
        echo "- Update dependencies with vulnerabilities" >> security-report.md
        echo "- Address any secrets found in code" >> security-report.md
        echo "- Ensure all security tests pass" >> security-report.md
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.md
    
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('security-report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## 🔒 Security Scan Results\n\n' + report
          });

  notify-security-team:
    name: Notify Security Team
    runs-on: ubuntu-latest
    needs: [static-analysis, dependency-scan, secrets-scan]
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Send security alert
      run: |
        echo "Security scan failure detected on main branch"
        echo "Commit: ${{ github.sha }}"
        echo "Please review the security scan results immediately"
        # In a real environment, this would send alerts to security team
        # via Slack, email, PagerDuty, etc.