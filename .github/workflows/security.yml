name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # weekly Monday 08:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - name: Install govulncheck
        # Pinned: govulncheck v1.4.0 panics ("ForEachElement called on type
        # containing *types.TypeParam") analyzing generics, so @latest crashes the
        # scan (exit 1, not a vulnerability finding). v1.3.0 is the last release
        # that handles generic code. Bump once the upstream regression is fixed.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Scan all modules
        run: |
          # govulncheck is per-module; scan the root and every nested go.mod
          # (benchmarks/ and examples/library-usage/* pin their own deps).
          set -e
          fail=0
          for mod in $(find . -name go.mod -not -path '*/vendor/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::govulncheck $dir"
            ( cd "$dir" && govulncheck ./... ) || fail=1
            echo "::endgroup::"
          done
          exit $fail

  gosec:
    name: Go SAST (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: gosec scan
        # Gated at HIGH severity AND HIGH confidence, which is currently zero
        # findings and so is enforceable. The lower tiers are dominated by
        # G115 (integer conversion) and G304 (variable file path) — for an
        # archiving tool that reads user-named files by design, those are
        # thousands-strong and not individually actionable, so blocking on them
        # would just teach us to ignore the job. Triaged findings are annotated
        # inline with `#nosec <rule> -- <reason>`.
        #
        # gosec is what found #311: a live path traversal in `download` that
        # every other scanner in this workflow missed.
        run: gosec -severity=high -confidence=high ./...
      - name: gosec full report (informational)
        if: always()
        run: gosec -no-fail -fmt=text ./... || true

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # full history so leaked-then-removed secrets are caught
      # Run the gitleaks BINARY directly (MIT-licensed, free for orgs). The
      # gitleaks-action wrapper requires a paid license for GitHub organizations,
      # which we don't use. `detect` scans full history; non-zero exit on leaks.
      # The tarball SHA-256 is pinned and verified BEFORE extraction. Piping curl
      # straight into tar, as this step used to, executes whatever the URL serves
      # — a compromised release asset or a MITM would run in CI with repo access.
      # Update both VER and SHA256 together; the value comes from the release's
      # own gitleaks_${VER}_checksums.txt.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f gitleaks.tar.gz
          gitleaks version
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Trivy filesystem scan (vulns + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: Trivy config scan (IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Digest-pinned, like every action in this repo (#359). This was
    # `semgrep/semgrep` with no tag at all, i.e. floating `:latest`: whatever the
    # registry served that morning got to run in the job with the repository
    # checked out. That is the one image in the repo the runner pulls on our
    # behalf, so it was also the one supply-chain input the action pinning did not
    # cover.
    #
    # The digest is the multi-arch index digest, so it resolves on both amd64 and
    # arm64 runners. The version in the comment is documentation, not a
    # constraint — verified: pulling `semgrep/semgrep:1.100.0@sha256:bdf7013b…`
    # runs 1.171.0, because Docker resolves the digest and ignores the tag. Hence
    # the comment form used for actions rather than a `:tag@sha256:` that would
    # imply the tag is enforced.
    #
    # This pins the *engine*, not the ruleset: `--config=auto` below fetches rules
    # from the Semgrep registry at scan time, so findings can still change between
    # runs without this line moving. Dependabot's docker ecosystem is scoped to
    # /docker and does not watch workflow files, so bumping this is manual.
    container:
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8 # 1.171.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Enforcing: fails the build on findings. Triaged false-positives are
      # annotated inline with `# nosemgrep: <rule-id> -- <reason>`.
      - name: Semgrep scan
        run: semgrep scan --config=auto --error .
