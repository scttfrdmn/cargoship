name: Integration Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # 3 AM UTC every Monday
  workflow_dispatch:

concurrency:
  group: integration-benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.24'

jobs:
  benchmark-unit:
    name: Unit Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Benchmarks
        id: run_bench
        run: |
          echo "Running unit benchmarks..."
          START_TIME=$(date +%s)

          go test -bench=. -benchmem -count=5 \
            -timeout=20m \
            ./pkg/compression \
            ./pkg/chunking \
            ./pkg/pipeline \
            ./pkg/staging \
            2>&1 | tee benchmark-current.txt

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT

          echo "Benchmarks completed in ${DURATION} seconds"

      - name: Download Baseline
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: baseline
        continue-on-error: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare with Baseline
        id: compare
        if: hashFiles('baseline/benchmark-baseline.txt') != ''
        run: |
          echo "Comparing with baseline..."
          benchstat baseline/benchmark-baseline.txt benchmark-current.txt \
            > comparison.txt

          cat comparison.txt

          # Check for significant regressions (>10% slower)
          REGRESSION=false
          if grep -E '~[0-9]+%.*slower' comparison.txt | \
             awk '{gsub(/[~%]/,"",$2); if($2 > 10) exit 1}'; then
            REGRESSION=true
          fi

          echo "regression=${REGRESSION}" >> $GITHUB_OUTPUT

          # Count regressions
          REGRESSION_COUNT=$(grep -E '~[0-9]+%.*slower' comparison.txt | \
             awk '{gsub(/[~%]/,"",$2); if($2 > 10) print}' | wc -l)
          echo "regression_count=${REGRESSION_COUNT}" >> $GITHUB_OUTPUT

      - name: Upload Comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-${{ github.sha }}
          path: |
            benchmark-current.txt
            comparison.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Update Baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark-current.txt
          retention-days: 90

      - name: Generate Summary
        if: always()
        run: |
          echo "## 📊 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f comparison.txt ]; then
            REGRESSION="${{ steps.compare.outputs.regression }}"
            if [ "${REGRESSION}" == "true" ]; then
              echo "⚠️ **Performance regression detected** (>10% slower)" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ **No significant performance regression**" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary>View Benchmark Comparison</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat comparison.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No baseline available for comparison**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This is the first benchmark run. Future runs will compare against this baseline." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Duration**: ${{ steps.run_bench.outputs.duration || 'N/A' }}" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            let body = `## 📊 Benchmark Results\n\n`;

            // Check if comparison file exists
            if (fs.existsSync('comparison.txt')) {
              const comparison = fs.readFileSync('comparison.txt', 'utf8');
              const regression = '${{ steps.compare.outputs.regression }}';
              const regressionCount = '${{ steps.compare.outputs.regression_count }}';

              if (regression === 'true') {
                body += `⚠️ **Performance regression detected**\n\n`;
                body += `Found ${regressionCount} benchmark(s) >10% slower than baseline.\n\n`;
              } else {
                body += `✅ **No significant performance regression**\n\n`;
              }

              body += `<details>\n`;
              body += `<summary>View Benchmark Comparison</summary>\n\n`;
              body += `\`\`\`\n${comparison}\n\`\`\`\n\n`;
              body += `</details>\n\n`;
            } else {
              body += `ℹ️ **No baseline available for comparison**\n\n`;
              body += `This is the first benchmark run for this PR. `;
              body += `Merge to main to establish a baseline for future comparisons.\n\n`;
            }

            body += `[View detailed results →](${runUrl})`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Benchmark Results')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
