# CargoShip Central Controller Configuration
# This configuration sets up the central coordination hub for distributed ghost ships

# Server Configuration
listen_address: "0.0.0.0"
port: 8080
tls_enabled: true
cert_file: "/etc/cargoship/controller.crt"
key_file: "/etc/cargoship/controller.key"

# Authentication
auth_enabled: true
auth_tokens:
  - "${CARGOSHIP_CONTROLLER_TOKEN}"
  - "${CARGOSHIP_ADMIN_TOKEN}"

# Health and Monitoring
health_check:
  enabled: true
  check_interval: "1m"
  report_interval: "5m" 
  metrics_enabled: true

metrics_port: 9090

# Agent Management
agent_timeout: "5m"      # Consider agents offline after 5 minutes
ping_interval: "30s"     # Ping agents every 30 seconds