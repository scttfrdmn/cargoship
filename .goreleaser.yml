# GoReleaser configuration for CargoShip
# https://goreleaser.com

version: 2

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy
    # Tests are run in GitHub Actions before this workflow is triggered
    # - go test -short ./...

builds:
  - id: cargoship
    main: ./cmd/cargoship
    binary: cargoship
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude invalid combinations
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser
    flags:
      - -trimpath

archives:
  - id: cargoship
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - docs/*.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Provenance: who built this, not just "did it download intact".
#
# checksums.txt on its own proves neither. It is published by the same job, over
# the same channel, as the artifacts it attests — so whoever can alter one can
# alter both. The signature below binds checksums.txt to the GitHub Actions
# workflow identity that produced it, and because every artifact's SHA-256 is
# *in* that file, one signature covers the whole release.
#
# Keyless (OIDC), so there is no long-lived private key to manage, rotate or
# leak: cosign exchanges the workflow's short-lived OIDC token for a Fulcio
# certificate and records the signature in the Rekor transparency log. That needs
# `id-token: write` on the release job — see .github/workflows/release.yml.
signs:
  - cmd: cosign
    artifacts: checksum
    # cosign v3 removed --output-signature / --output-certificate. The Sigstore
    # bundle is now the only keyless output format: one JSON file carrying the
    # signature, the Fulcio certificate and the Rekor inclusion proof. Recipes
    # that still pass --output-signature are written for cosign v2 and fail here.
    signature: '${artifact}.sigstore.json'
    output: true
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      # Non-interactive: fail rather than open a browser OIDC flow if the ambient
      # token is missing. Without this a misconfigured job hangs until timeout.
      - '--yes'

# Dependency inventory per release. Worth having on its own terms, but
# specifically useful here: transitive CVEs land in this project between releases
# often enough that "which version of X did v0.20.0 ship?" is a question we
# actually have to answer (see the govulncheck and Trivy history).
sboms:
  - id: archive
    artifacts: archive

# Sign and notarize the darwin binaries with an Apple Developer ID (#381).
#
# Without this, our darwin artifacts are `adhoc,linker-signed` only. That is fine
# until the file carries `com.apple.quarantine` — which anything downloaded by a
# browser or a cask does — at which point Gatekeeper does not warn, it
# **SIGKILLs the process**: rc=137, no output, no diagnostic. Measured on the
# published v0.22.0 darwin_arm64 binary. A tool whose failure mode is "killed
# with no message" is indistinguishable from a corrupt download.
#
# This is also the prerequisite for migrating `brews:` to `homebrew_casks:`:
# casks propagate quarantine, formulae do not, so the migration had to wait for
# notarization or `brew install` would have broken on macOS. Notarize first,
# migrate second — deliberately two separate changes, so that if notarization is
# misconfigured we find out while formulae are still serving users.
#
# Runs on ubuntu-latest, not a macOS runner: goreleaser uses `quill`, a pure-Go
# Mach-O signer, rather than Apple's `codesign`. Verified against 2.17.1 — this
# is OSS goreleaser, not Pro (confirmed by running it: it fails on a bad
# certificate, not on a licence check).
#
# Ordering matters and is goreleaser's, not ours: build → **sign & notarize** →
# archives → checksums. So the archive contains the signed binary, and the
# signature is covered by the cosign-signed checksums.txt like everything else.
# Verified by running a release with this stanza present.
notarize:
  macos:
    # `enabled` is a template, not a literal `true`: a fork or a local
    # `goreleaser release --snapshot` has no certificate, and a hard `true` would
    # fail their build at the signing step. Gating on the secret being present
    # means the pipe skips cleanly when it cannot run, and runs whenever the
    # material exists. The tag-time release always has it — see release.yml.
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - cargoship
      sign:
        # Base64-encoded .p12 holding the Developer ID Application certificate
        # and its private key. Base64 because a secret has to survive being an
        # environment variable; goreleaser decodes it.
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ .Env.MACOS_SIGN_PASSWORD }}'
      notarize:
        # App Store Connect API key (Issuer ID + Key ID + base64 .p8). An API key
        # is used rather than an Apple ID and app-specific password because it is
        # scoped, revocable independently of the account, and carries no password
        # that unlocks anything else.
        issuer_id: '{{ .Env.MACOS_NOTARY_ISSUER_ID }}'
        key_id: '{{ .Env.MACOS_NOTARY_KEY_ID }}'
        key: '{{ .Env.MACOS_NOTARY_KEY }}'
        # Wait for Apple to return a verdict rather than submitting and moving on.
        # A release that ships an unnotarized binary because the submission was
        # still queued is the exact failure this stanza exists to prevent, and
        # the draft→verify→promote flow means waiting costs only wall-clock.
        wait: true
        timeout: 30m

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: 'Refactoring'
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 3
    - title: 'Documentation'
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: 'Other'
      order: 999

release:
  github:
    owner: scttfrdmn
    name: cargoship
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## CargoShip {{ .Tag }}

    **Release Date:** {{ .Date }}

    High-performance S3 upload tool with intelligent sharding, compression, and cost management.

    ### Installation

    **Homebrew (macOS/Linux):**
    ```bash
    brew install scttfrdmn/tap/cargoship
    ```

    **Scoop (Windows):**
    ```bash
    scoop bucket add scttfrdmn https://github.com/scttfrdmn/scoop-bucket
    scoop install cargoship
    ```

    **Go Install:**
    ```bash
    go install github.com/scttfrdmn/cargoship/cmd/cargoship@{{ .Tag }}
    ```

    **Direct Download:**
    Download the appropriate binary for your platform below.

  footer: |
    ---

    **Full Changelog**: https://github.com/scttfrdmn/cargoship/compare/{{ .PreviousTag }}...{{ .Tag }}

    **Documentation**: https://github.com/scttfrdmn/cargoship/tree/{{ .Tag }}/docs

    ---

    _Built with ❤️ using [GoReleaser](https://goreleaser.com)_

# Homebrew tap
#
# Still `brews:` (a formula), not `homebrew_casks:`, deliberately — see #381 and
# the header of scripts/ci/check-goreleaser-config.sh, which allowlists this one
# deprecation. Short version: casks propagate macOS quarantine, our darwin
# binaries are not notarized, and a quarantined release binary is SIGKILLed by
# Gatekeeper. Migrating before notarization would break `brew install` on macOS.
brews:
  - repository:
      owner: scttfrdmn
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/scttfrdmn/cargoship
    description: High-performance S3 upload tool with intelligent sharding and compression
    # The repo is Apache-2.0 (see LICENSE). This said MIT, so every published
    # formula has declared the wrong license — including the live tap today.
    license: Apache-2.0
    skip_upload: auto
    test: |
      system "#{bin}/cargoship", "--version"
    install: |
      bin.install "cargoship"

# Scoop bucket
scoops:
  - repository:
      owner: scttfrdmn
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://github.com/scttfrdmn/cargoship
    description: High-performance S3 upload tool with intelligent sharding and compression
    # Apache-2.0, matching LICENSE — this also said MIT.
    license: Apache-2.0
    skip_upload: auto

