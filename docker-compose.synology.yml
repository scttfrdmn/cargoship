# CargoShip Ghost Ship Docker Compose for Synology NAS
# Generic Synology Container Manager deployment using DSM Project feature

services:
  cargoship-ghost-ship:
    image: cargoship:synology-latest
    container_name: cargoship-ghost-synology
    restart: unless-stopped
    network_mode: host
    
    # User mapping for Synology - use custom docker user/group
    # Default: uid=1027(dockerlimited) gid=65537(dockergroup)
    # Adjust these values based on your Synology docker user setup
    user: "1027:65537"
    
    volumes:
      # Synology data access using volume numbers (read-only)
      - /volume1/Public:/data/public:ro
      - /volume1/homes:/data/homes:ro
      
      # Configuration and credentials using Synology paths
      - /volume1/docker/cargoship/ghost_ship.yaml:/etc/cargoship/ghost_ship.yaml:ro
      - /volume1/homes/${USER}/.aws:/home/cargoship/.aws:ro
      
      # Working directories using standard Synology docker paths
      - /volume1/docker/cargoship/logs:/var/log/cargoship
      - /volume1/docker/cargoship/data:/tmp/cargoship
      - /volume1/docker/cargoship/results:/results
    
    environment:
      - CARGOSHIP_LOG_LEVEL=info
      - CARGOSHIP_METRICS_ENABLED=true
      - CARGOSHIP_CONFIG_FILE=/etc/cargoship/ghost_ship.yaml
      - CARGOSHIP_NETWORK_OPTIMIZE=true
      - GOMAXPROCS=0
      - AWS_DEFAULT_REGION=us-west-2
      # AWS credentials are mounted via volume
    
    command: >
      /usr/local/bin/synology-startup.sh
      --config /etc/cargoship/ghost_ship.yaml
      --log-level info
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "cargoship.ghost.deployment=synology"
      - "cargoship.service=ghost-ship"
      - "cargoship.platform=synology-container-manager"

