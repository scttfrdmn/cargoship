[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvc-cargoship"
version = "0.1.0"
description = "DVC remote plugin for CargoShip bulk S3 uploads"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dvc", "cargoship", "s3", "remote", "data-version-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fsspec>=2023.1.0",
    "dvc>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.entry-points."dvc.fs"]
cargoship = "dvc_cargoship:CargoShipFileSystem"

[project.urls]
Homepage = "https://github.com/scttfrdmn/cargoship"
Documentation = "https://github.com/scttfrdmn/cargoship/tree/main/dvc-cargoship#readme"
"Bug Tracker" = "https://github.com/scttfrdmn/cargoship/issues"
Changelog = "https://github.com/scttfrdmn/cargoship/releases"

[tool.uv] # nosemgrep: python.uv.security.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown -- deps are fully pinned in uv.lock and updated deliberately; exclude-newer takes a fixed timestamp that would go stale
# Force patched versions of transitive dependencies (pulled in via dvc) that
# have known HIGH CVEs. These raise the floor without changing direct deps;
# remove an entry once dvc's own constraints move past it.
constraint-dependencies = [
    # GHSA-g6cj-pr64-35w5 (HIGH): PKCS#7 EnvelopedData decryption leaks a
    # Bleichenbacher oracle through distinguishable errors and timing. Fixed in
    # 50.0.0.
    "cryptography>=50.0.0",
    "orjson>=3.11.6",
    "urllib3>=2.7.0",
    "dulwich>=1.2.5",
    # GHSA-6p8h-3wgx-97gf / -fjr4-x663-mwxc / -r9mr-m37c-5fr3 / -94p4-4cq8-9g67
    # (HIGH): unsafe git-option denylist bypasses + env-var exfiltration. Fixed
    # in 3.1.55. Then GHSA-3f7w-8rr8-f37f (HIGH) — the same class again, in
    # IndexFile.checkout() and TagReference.create() — and GHSA-539m-9xh6-q6rr
    # (medium), where the denylist omitted --add-file/--add-virtual-file. Both
    # fixed in 3.1.57. Third round of this bug in as many months; the floor is
    # the only thing keeping the resolver off the vulnerable versions.
    "gitpython>=3.1.57",
    # GHSA-cq5v-8q36-5273 (HIGH): out-of-bounds heap read in the C HTTP response
    # parser's error path on a malformed chunked response. Also picks up
    # GHSA-mfx4-hv73-q22v (request smuggling via WebSocket upgrade) and
    # GHSA-mq44-7p77-q5h7 (compressed frames accepted without negotiated
    # permessage-deflate), both fixed in 3.14.2.
    "aiohttp>=3.14.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dvc_cargoship*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
