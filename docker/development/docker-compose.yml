# CargoShip Development and Testing Environment  
# This provides a complete local testing environment for the launch/ghost ship architecture

services:
  # Ghost Ship 1 - simulates astrapi.local
  ghost-ship-1:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ghost-ship
    container_name: cargoship-ghost-ship-1
    ports:
      - "9091:9090"    # Metrics
    volumes:
      - ./config/ghost-ship-1.yaml:/etc/cargoship/ghost_ship.yaml:ro
      - ./test-data/nas-1:/data/public:ro
      - ./certs:/etc/cargoship/certs:ro
      - ghost-ship-1-logs:/var/log/cargoship
      - ghost-ship-1-work:/tmp/cargoship
    environment:
      - CARGOSHIP_LOG_LEVEL=debug
      - CARGOSHIP_CONFIG_FILE=/etc/cargoship/ghost_ship.yaml
      - CARGOSHIP_AUTH_TOKEN=dev-ghost-token-111
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://substrate:4566
    networks:
      - cargoship-net
    depends_on:
      - substrate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Ghost Ship 2 - simulates another NAS
  ghost-ship-2:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.ghost-ship
    container_name: cargoship-ghost-ship-2
    ports:
      - "9092:9090"    # Metrics
    volumes:
      - ./config/ghost-ship-2.yaml:/etc/cargoship/ghost_ship.yaml:ro
      - ./test-data/nas-2:/data/public:ro
      - ./certs:/etc/cargoship/certs:ro
      - ghost-ship-2-logs:/var/log/cargoship
      - ghost-ship-2-work:/tmp/cargoship
    environment:
      - CARGOSHIP_LOG_LEVEL=debug
      - CARGOSHIP_CONFIG_FILE=/etc/cargoship/ghost_ship.yaml
      - CARGOSHIP_AUTH_TOKEN=dev-ghost-token-222
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-west-2
      - AWS_ENDPOINT_URL=http://substrate:4566
    networks:
      - cargoship-net
    depends_on:
      - substrate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Substrate - in-process AWS emulator (replaces LocalStack)
  substrate:
    image: ghcr.io/scttfrdmn/substrate:latest
    container_name: cargoship-substrate
    ports:
      - "4566:4566"
    environment:
      - SUBSTRATE_SERVER_ADDRESS=:4566
      - SUBSTRATE_LOG_LEVEL=error
    networks:
      - cargoship-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: cargoship-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - cargoship-net

  # Grafana - Monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: cargoship-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cargoship-net
    depends_on:
      - prometheus

  # Test Data Generator - creates test files for archival
  test-data-generator:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.test-data-generator
    container_name: cargoship-test-data-generator
    volumes:
      - ./test-data/nas-1:/output/nas-1
      - ./test-data/nas-2:/output/nas-2
    environment:
      - GENERATE_INTERVAL=30s
      - MAX_FILE_SIZE=50MB
      - FILE_TYPES=pdf,jpg,png,docx,xlsx,zip
    networks:
      - cargoship-net
    profiles:
      - testing

  # Integration Tests - runs test suite
  integration-tests:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.integration-tests
    container_name: cargoship-integration-tests
    volumes:
      - ./test-results:/test-results
      - ./test-data:/test-data:ro
    environment:
      - GHOST_SHIP_1_URL=http://ghost-ship-1:9090
      - GHOST_SHIP_2_URL=http://ghost-ship-2:9090
      - SUBSTRATE_URL=http://substrate:4566
      - TEST_TIMEOUT=300s
    networks:
      - cargoship-net
    depends_on:
      - ghost-ship-1
      - ghost-ship-2
      - substrate
    profiles:
      - testing

networks:
  cargoship-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ghost-ship-1-logs:
  ghost-ship-2-logs:
  ghost-ship-1-work:
  ghost-ship-2-work:
  prometheus-data:
  grafana-data: