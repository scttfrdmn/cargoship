# CargoShip Launch Agent Docker Compose
# For deployment on NAS devices (Synology, QNAP, etc.)

version: '3.8'

services:
  cargoship-agent: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service -- deployment template; service writes to mounted volumes (archives/TSDB/dashboards), read-only root not applicable
    image: scttfrdmn/cargoship:launch
    container_name: cargoship-launch-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Environment variables for configuration
    environment:
      # Required: Controller connection
      - CARGOSHIP_CONTROLLER_URL=${CARGOSHIP_CONTROLLER_URL}
      - CARGOSHIP_AUTH_TOKEN=${CARGOSHIP_AUTH_TOKEN}
      
      # Required: Archive destination
      - CARGOSHIP_DESTINATION=${CARGOSHIP_DESTINATION}
      
      # Optional: Watch paths (comma-separated)
      - CARGOSHIP_WATCH_PATHS=${CARGOSHIP_WATCH_PATHS:-/data}
      
      # Optional: Storage class
      - CARGOSHIP_STORAGE_CLASS=${CARGOSHIP_STORAGE_CLASS:-deep-archive}
      
      # Optional: File patterns
      - CARGOSHIP_PATTERNS=${CARGOSHIP_PATTERNS:-*.fastq.gz,*.bam,*.tiff,*.csv}
      - CARGOSHIP_EXCLUDE_PATTERNS=${CARGOSHIP_EXCLUDE_PATTERNS:-*.tmp,*.lock,.DS_Store}
      
      # Optional: Timing
      - CARGOSHIP_CHECK_INTERVAL=${CARGOSHIP_CHECK_INTERVAL:-300}
      - CARGOSHIP_MIN_AGE_DAYS=${CARGOSHIP_MIN_AGE_DAYS:-7}
      
      # Optional: Agent identification
      - CARGOSHIP_AGENT_NAME=${CARGOSHIP_AGENT_NAME:-NAS Archive Agent}
      - CARGOSHIP_AGENT_DESCRIPTION=${CARGOSHIP_AGENT_DESCRIPTION:-Automated research data archival}
      
      # Optional: Logging
      - CARGOSHIP_LOG_LEVEL=${CARGOSHIP_LOG_LEVEL:-info}
    
    # Volume mounts
    volumes:
      # Data directories (read-only)
      - ${DATA_PATH:-/volume1/research-data}:/data:ro
      
      # Configuration (optional, use environment variables instead)
      - ${CONFIG_PATH:-./config}:/config:ro
      
      # AWS credentials (required for S3 access)
      - ${AWS_CREDENTIALS_PATH:-~/.aws}:/home/cargoship/.aws:ro
      
      # Logs (optional)
      - ${LOGS_PATH:-./logs}:/logs
    
    # Network configuration
    networks:
      - cargoship-network
    
    # Health check
    healthcheck:
      test: ["CMD", "cargoship-launch", "-validate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Resource limits (adjust for your NAS)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cargoship-network:
    driver: bridge

# Example .env file contents:
# CARGOSHIP_CONTROLLER_URL=https://cargoship.lab.university.edu
# CARGOSHIP_AUTH_TOKEN=your-secure-auth-token
# CARGOSHIP_DESTINATION=s3://research-archive
# CARGOSHIP_WATCH_PATHS=/data/completed,/data/analysis-output
# DATA_PATH=/volume1/research-data
# AWS_CREDENTIALS_PATH=/volume1/docker/cargoship/.aws