# Docker Compose for CargoShip on the astrapi QNAP NAS
#
# One service: a ghost ship. It polls its watch paths, archives what matches its
# rules, and uploads to S3. It binds no port and accepts no inbound connections,
# so there is nothing to publish, nothing to health-check over HTTP, and nothing
# for Prometheus to scrape. Status goes to the container log:
#
#   docker logs -f cargoship-astrapi-ghost-ship

services:
  cargoship-ghost-ship: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service -- deployment template; the ghost ship writes archives to a mounted volume, read-only root not applicable
    build:
      context: ..
      dockerfile: docker/Dockerfile.astrapi
    image: cargoship:astrapi-latest
    container_name: cargoship-astrapi-ghost-ship

    # Flags only — the image entrypoint is astrapi-startup.sh, which execs
    # ghost-ship with whatever is here appended. Do NOT name the binary again:
    # Go's flag package stops parsing at the first non-flag argument, so a
    # leading "/usr/local/bin/ghost-ship" would silently discard every flag
    # after it and the ship would sail with its built-in defaults.
    command: ["--config", "/etc/cargoship/ghost_ship.yaml", "--log-level", "info"]

    # No host networking (#358). The previous comment here justified it as "safe
    # because the ghost ship listens on nothing" — which answers the wrong
    # question. Nothing needs to reach *in*; the risk is what the container can
    # reach *out* to. `network_mode: host` puts it on the host's loopback, so
    # anything bound to 127.0.0.1 on the NAS — admin UIs, databases, other
    # containers' debug endpoints — becomes reachable from this process. A
    # compromised archival agent should not inherit that.
    #
    # The claimed benefit was upload throughput, which does not hold up: this
    # container makes outbound HTTPS connections to S3, and bridge networking
    # costs a NAT hop that is immaterial next to a WAN round-trip. Default bridge
    # networking is used instead, which needs no configuration here.

    # Resource limits optimized for astrapi
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'

    # Environment variables.
    #
    # ghost-ship reads no CARGOSHIP_* variables — it takes flags, and its tuning
    # comes from the mounted config file. The CARGOSHIP_METRICS_ENABLED /
    # NETWORK_OPTIMIZE / BBR / CUBIC / PREDICTIVE_MODE / MAX_CONNECTIONS /
    # BUFFER_SIZE settings that used to be listed here were read by no code in
    # the repo; set them under optimization_config in astrapi-config.yaml instead.
    environment:
      - GOMAXPROCS=4
      - GOGC=100
      - AWS_PROFILE=aws
      - AWS_DEFAULT_REGION=us-east-1

    # Volume mounts for genomics data access and AWS credentials
    volumes:
      # Genomics training data directory
      - /volume1/genomics_training:/volume1/genomics_training:ro

      # AWS credentials. Mounted at the *container user's* home, not /root: the
      # image runs as uid 1000, whose HOME is /home/cargoship, and /root is mode
      # 0700 owned by root — the SDK could never have read a /root/.aws mount.
      - /volume1/homes/admin/.aws:/home/cargoship/.aws:ro

      # Ghost ship configuration. The container path must match --config above.
      - ./astrapi-config.yaml:/etc/cargoship/ghost_ship.yaml:ro

      # Somewhere to stage archives before upload
      - /volume1/docker/cargoship/results:/results:rw

    # No ports and no healthcheck: ghost-ship binds nothing, so a curl-based
    # healthcheck could only ever fail and mark this container unhealthy. The
    # commented-out "Launch API" on :8080 was removed in #340; the :9090 metrics
    # endpoint never existed at all (#348). Likewise no prometheus or grafana
    # service — they scraped that phantom endpoint and mounted a prometheus.yml
    # and grafana-dashboards/ that are not in this repo.

    # Restart policy
    restart: unless-stopped

    # Security settings
    security_opt:
      - no-new-privileges:true

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

    # Labels for container management
    labels:
      - "com.cargoship.service=ghost-ship"
      - "com.cargoship.environment=astrapi-production"
