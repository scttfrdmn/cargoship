  - Deployment:
    - Deployment Guide: DEPLOYMENT_GUIDE.md
    - Launch Agent Setup: launch-agent.md
    - Launch Agent Documentation: deployment/README_LAUNCH.md
    - Ghost Ship Deployment: deployment/GHOST_SHIP_DEPLOYMENT_GUIDE.md
    - QNAP Deployment: QNAP_DEPLOYMENT.md
  - Research Scenarios:
    - Genomics Researcher: USER_SCENARIOS/01_GENOMICS_RESEARCHER_WALKTHROUGH.md
    - Imaging Researcher: USER_SCENARIOS/02_IMAGING_RESEARCHER_WALKTHROUGH.md
    - Lab Data Manager: USER_SCENARIOS/03_LAB_DATA_MANAGER_WALKTHROUGH.md
    - Principal Investigator: USER_SCENARIOS/04_PRINCIPAL_INVESTIGATOR_WALKTHROUGH.md
  - Migration:
    - From rclone: MIGRATION_FROM_RCLONE.md
  - Blog:
    - Overview: blog/index.md
    - "Part 1: Why We Built CargoShip": blog/post-1-why-we-built-cargoship.md
    - "Part 2: Zero-Disk Streaming": blog/post-2-zero-disk-streaming.md
    - "Part 3: 8x S3 Performance": blog/post-3-multi-prefix-sharding.md
    - "Part 4: Save 90% on S3 Costs": blog/post-4-cost-optimization.md
    - "Part 5: Open Format, Open Source": blog/post-5-open-source.md
  - Reference:
    - API Stability: api-stability.md
    - Versioning: versioning.md
    - Attribution: ATTRIBUTION.md
    - Changelog: ../CHANGELOG.md
    - Roadmap: ../ROADMAP.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/scttfrdmn/cargoship
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/scttfrdmn/cargoship
  analytics:
    provider: google
    property: G-PLACEHOLDER # Replace with actual GA property when ready

