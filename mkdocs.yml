  - Home: index.md
  - Getting Started:
    - Installation: install.md
    - Quick Start Wizard: wizard.md
    - User Guide: USER_GUIDE.md
    - Basic Configuration: advanced/defaults_overrides.md
  - Features:
    - Architecture: ARCHITECTURE.md
    - Storage Format: STORAGE_FORMAT.md
    - CargoHold Guide: CARGOHOLD_GUIDE.md
    - Cost Management: cost-management.md
    - Budget Guide: BUDGET_USER_GUIDE.md
    - Security: SECURITY.md
    - Performance Benchmarks: PERFORMANCE_BENCHMARKS.md
    - Optimization Guide: OPTIMIZATION_GUIDE.md
  - CLI Reference: CLI_REFERENCE.md
  - Advanced:
    - GPG Encryption: advanced/gpg_encryption.md
    - Travel Agent (Web UI): advanced/travelagent.md
    - Benchmarking: advanced/benchmarks.md
