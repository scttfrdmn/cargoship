# CargoShip Ghost Ship Docker Compose for QNAP NAS
# Generic QNAP Container Station deployment

services:
  cargoship-ghost-ship:
    image: cargoship:qnap-latest
    container_name: cargoship-ghost-qnap
    restart: unless-stopped
    network_mode: host
    
    # User mapping - match QNAP user permissions (uid:gid = user:everyone)
    user: "1000:100"
    
    volumes:
      # QNAP data access using standard symlinks (read-only)
      - /share/Public:/data/public:ro
      - /share/homes:/data/homes:ro
      
      # Configuration and credentials
      - /share/homes/${USER}/ghost_ship.yaml:/etc/cargoship/ghost_ship.yaml:ro
      - /share/homes/${USER}/.aws:/home/cargoship/.aws:ro
      
      # Working directories using Container Station standard paths
      - /share/Container/cargoship-logs:/var/log/cargoship
      - /share/Container/cargoship-data:/tmp/cargoship
      - /share/Container/cargoship-results:/results
    
    environment:
      - CARGOSHIP_LOG_LEVEL=info
      - CARGOSHIP_METRICS_ENABLED=true
      - CARGOSHIP_CONFIG_FILE=/etc/cargoship/ghost_ship.yaml
      - CARGOSHIP_NETWORK_OPTIMIZE=true
      - GOMAXPROCS=0
      - AWS_DEFAULT_REGION=us-west-2
      # AWS credentials are mounted via volume
    
    command: >
      /usr/local/bin/qnap-startup.sh
      --config /etc/cargoship/ghost_ship.yaml
      --log-level info
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "cargoship.ghost.deployment=qnap"
      - "cargoship.service=ghost-ship"
      - "cargoship.platform=qnap-container-station"

