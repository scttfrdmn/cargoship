---
version: 2
before:
  hooks:
    - go mod tidy
    - ./scripts/completions.sh
    - ./scripts/manpages.sh
env:
  - GO111MODULE=on
builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/cargoship
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags: |
      -s -w
      -X main.version={{ .Version }}
      -X main.commit={{ .ShortCommit }}
      -X main.date={{ .CommitTimestamp }}
    targets:
      - go_first_class
    binary: 'cargoship'
archives:
  - name_template: '{{ .ProjectName }}-{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES/*
      - completions/*
      - manpages/*
checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}_SHA256SUMS'
  algorithm: sha256
brews:
  - repository:
      owner: scttfrdmn
      name: homebrew-cargoship
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    description: "High-performance S3 file upload optimization tool"
    homepage: https://github.com/scttfrdmn/cargoship
    license: "MIT"
    install: |
      bin.install "cargoship"
      bash_completion.install "completions/cargoship.bash" => "cargoship"
      zsh_completion.install "completions/cargoship.zsh" => "_cargoship"
      fish_completion.install "completions/cargoship.fish"
      man1.install "manpages/cargoship.1.gz"
nfpms:
  - id: rpms
    license: MIT
    description: High-performance S3 file upload optimization tool for large-scale data transfers
    vendor: Scott Friedman
    section: admin
    priority: optional
    maintainer: Scott Friedman <scott@example.com>
    homepage: https://github.com/scttfrdmn/cargoship
    rpm:
      signature:
        key_file: "{{ .Env.GPG_KEY_PATH }}"
    formats:
      - rpm
    contents:
      - src: ./manpages/cargoship.1.gz
        dst: /usr/share/man/man1/cargoship.1.gz
        file_info:
          mode: 0644
      - src: ./completions/cargoship.bash
        dst: /usr/share/bash-completion/completions/cargoship
        file_info:
          mode: 0644
      - src: ./completions/cargoship.fish
        dst: /usr/share/fish/vendor_completions.d/cargoship.fish
        file_info:
          mode: 0644
      - src: ./completions/cargoship.zsh
        dst:  /usr/share/zsh/vendor-completions/_cargoship
        file_info:
          mode: 0644
  - id: debs
    license: MIT
    description: High-performance S3 file upload optimization tool for large-scale data transfers
    vendor: Scott Friedman
    section: admin
    priority: optional
    homepage: https://github.com/scttfrdmn/cargoship
    maintainer: Scott Friedman <scott@example.com>
    formats:
      - deb
    contents:
      - src: ./manpages/cargoship.1.gz
        dst: /usr/share/man/man1/cargoship.1.gz
        file_info:
          mode: 0644
      - src: ./completions/cargoship.bash
        dst: /usr/share/bash-completion/completions/cargoship
        file_info:
          mode: 0644
      - src: ./completions/cargoship.fish
        dst: /usr/share/fish/vendor_completions.d/cargoship.fish
        file_info:
          mode: 0644
      - src: ./completions/cargoship.zsh
        dst:  /usr/share/zsh/vendor-completions/_cargoship
        file_info:
          mode: 0644
  - id: apks
    bindir: /usr/bin
    license: MIT
    description: High-performance S3 file upload optimization tool for large-scale data transfers
    vendor: Scott Friedman
    section: admin
    priority: optional
    homepage: https://github.com/scttfrdmn/cargoship
    maintainer: Scott Friedman <scott@example.com>
    formats:
      - apk
      - archlinux
    contents:
      - src: ./manpages/cargoship.1.gz
        dst: /usr/share/man/man1/cargoship.1.gz
        file_info:
          mode: 0644
      - src: ./completions/cargoship.bash
        dst: /usr/share/bash-completion/completions/cargoship
        file_info:
          mode: 0644
      - src: ./completions/cargoship.fish
        dst: /usr/share/fish/vendor_completions.d/cargoship.fish
        file_info:
          mode: 0644
      - src: ./completions/cargoship.zsh
        dst:  /usr/share/zsh/vendor-completions/_cargoship
        file_info:
          mode: 0644
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"
